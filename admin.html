<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — LeicesterCS</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>
<body>

  <nav id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">LeicesterCS</a>
    </div>
  </nav>

  <div class="page-wrap">
    <div class="page-header">
      <div class="page-header-inner">
        <div class="sec-label">ADMIN</div>
        <h1 class="sec-title">SITE<br/><span class="accent">CONTROL.</span></h1>
      </div>
    </div>

    <main class="page-main">
      <div class="container">

        <!-- LOGIN -->
        <div id="login-section" style="max-width:420px; padding:32px; border:1px solid var(--border); background:var(--bg-card);">
          <div class="sec-label" style="margin-bottom:16px;">ADMIN LOGIN</div>
          <input type="password" id="admin-password" placeholder="Enter password" style="width:100%; margin-bottom:12px;">
          <button id="login-btn" class="btn-primary">LOGIN</button>
          <div id="login-error" style="display:none; color:#ff5c5c; font-size:0.5rem; margin-top:12px;">Invalid password</div>
        </div>

        <!-- DASHBOARD (hidden until login) -->
        <div id="dashboard" style="display:none;">

          <div style="display:flex; gap:12px; margin-bottom:32px;">
            <button id="logout-btn" style="margin-left:auto;">LOGOUT</button>
          </div>

          <!-- EVENTS -->
          <section id="panel-events">
            <div style="padding:32px; border:1px solid var(--border); background:var(--bg-card); margin-bottom:32px;">
              <div class="sec-label" style="margin-bottom:16px;">ADD NEW EVENT</div>
              <form id="add-event-form">
                <input type="hidden" id="event-id" value="">
                <input type="text" id="event-title" placeholder="Title" required style="width:100%; margin-bottom:10px;">
                <input type="date" id="event-date" required style="width:100%; margin-bottom:10px;">
                <label style="display:block; font-size:0.4rem; color:var(--grey); margin-bottom:4px;">End date (leave blank for single-day events)</label>
                <input type="date" id="event-end-date" style="width:100%; margin-bottom:10px;">
                <input type="time" id="event-time" style="width:100%; margin-bottom:10px;">
                <textarea id="event-desc" placeholder="Description" required style="width:100%; margin-bottom:10px;"></textarea>
                <input type="text" id="event-location" placeholder="Location" style="width:100%; margin-bottom:10px;">
                <input type="text" id="action-link" placeholder="Action Link (URL)" style="width:100%; margin-bottom:10px;">
                <input type="text" id="action-label" placeholder="Action Label (e.g., Register, Buy Ticket)" style="width:100%; margin-bottom:10px;">
                <button type="submit" id="event-submit-btn" class="btn-primary">ADD EVENT</button>
                <button type="button" id="event-cancel-btn" style="display:none; margin-left:8px;">CANCEL</button>
              </form>
            </div>

            <div class="sec-label" style="margin-bottom:16px;">CURRENT EVENTS</div>
            <div id="events-list"></div>
          </section>

        </div>
      </div>
    </main>

    <footer id="footer">
      <div class="container">
        <div class="footer-bottom">
          <span>© 2026 LEICESTERCS</span>
          <span>ADMIN</span>
        </div>
      </div>
    </footer>
  </div>

  <script src="nav.js"></script>
  <script>
    const loginSection = document.getElementById('login-section');
    const dashboard = document.getElementById('dashboard');
    const loginError = document.getElementById('login-error');

    function getToken() {
      return sessionStorage.getItem('adminToken');
    }

    function setLoggedIn(loggedIn) {
      if (loggedIn) {
        sessionStorage.setItem('adminToken', 'authenticated');
        loginSection.style.display = 'none';
        dashboard.style.display = 'block';
        loadEvents();
      } else {
        sessionStorage.removeItem('adminToken');
        loginSection.style.display = 'block';
        dashboard.style.display = 'none';
      }
    }

    document.getElementById('login-btn').addEventListener('click', async () => {
      const password = document.getElementById('admin-password').value;
      loginError.style.display = 'none';
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        if (response.ok) {
          const data = await response.json();
          setLoggedIn(true);
        } else {
          loginError.style.display = 'block';
        }
      } catch (error) {
        loginError.textContent = 'Login failed — try again';
        loginError.style.display = 'block';
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => setLoggedIn(null));

    function formatEventDateRange(startStr, endStr) {
      if (!startStr) return '';
      const s = new Date(startStr + 'T00:00:00');
      if (!endStr || endStr === startStr) {
        return s.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
      }
      const e = new Date(endStr + 'T00:00:00');
      const sameMonth = s.getMonth() === e.getMonth() && s.getFullYear() === e.getFullYear();
      const sameYear = s.getFullYear() === e.getFullYear();
      const startFmt = s.toLocaleDateString('en-GB', { day: 'numeric', month: sameMonth ? undefined : 'short' });
      const endFmt = e.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: sameYear ? undefined : 'numeric' });
      return `${startFmt} – ${endFmt}`;
    }

    // Events
    async function loadEvents() {
  const list = document.getElementById('events-list');
  list.innerHTML = 'Loading…';
  try {
    const response = await fetch('/api/events');
    const events = await response.json();
    list.innerHTML = events.length === 0 ? '<p>No events yet.</p>' : '';
    events.forEach(event => {
      const row = document.createElement('div');
      row.className = 'event-row';
      const timeDisplay = event.event_time || 'Time will be updated';
      const dateDisplay = formatEventDateRange(event.event_date, event.event_end_date);
      row.innerHTML = `
        <div class="ev-body">
          <div class="ev-name">${event.title}</div>
          <div class="ev-desc">${event.description}</div>
        </div>
        <div class="ev-right">
          <span class="ev-date">${dateDisplay} — ${timeDisplay}</span>
          <span class="ev-link">${event.location || 'TBD'}</span>
          <span class="ev-action-link">
            ${event.action_link ? `<a href="${event.action_link}" target="_blank">${event.action_label || 'Action Link'}</a>` : 'No link'}
          </span>
          <button class="ev-edit-btn" data-id="${event.id}">EDIT</button>
          <button class="ev-delete-btn" data-id="${event.id}">DELETE</button>
        </div>
      `;
      list.appendChild(row);
    });

    document.querySelectorAll('.ev-edit-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const event = events.find(ev => ev.id == btn.dataset.id);
        document.getElementById('event-id').value = event.id;
        document.getElementById('event-title').value = event.title;
        document.getElementById('event-date').value = event.event_date;
        document.getElementById('event-end-date').value = event.event_end_date || '';
        document.getElementById('event-time').value = event.event_time || '';
        document.getElementById('event-desc').value = event.description || '';
        document.getElementById('event-location').value = event.location || '';
        document.getElementById('action-link').value = event.action_link || '';
        document.getElementById('action-label').value = event.action_label || '';
        document.getElementById('event-submit-btn').textContent = 'SAVE CHANGES';
        document.getElementById('event-cancel-btn').style.display = 'inline-block';
        window.scrollTo({ top: document.getElementById('add-event-form').offsetTop - 100, behavior: 'smooth' });
      });
    });

    document.querySelectorAll('.ev-delete-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this event?')) return;
        try {
          const response = await fetch(`/api/events?id=${btn.dataset.id}`, { method: 'DELETE' });
          if (response.ok) {
            loadEvents();
          } else {
            const result = await response.json();
            alert(result.error || 'Failed to delete event');
          }
        } catch (error) {
          alert('Failed to delete event');
        }
      });
    });
  } catch (error) {
    list.innerHTML = '<p>Failed to load events.</p>';
  }
}

document.getElementById('event-cancel-btn').addEventListener('click', () => {
  document.getElementById('add-event-form').reset();
  document.getElementById('event-id').value = '';
  document.getElementById('event-submit-btn').textContent = 'ADD EVENT';
  document.getElementById('event-cancel-btn').style.display = 'none';
});

document.getElementById('add-event-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('event-id').value;
  const title = document.getElementById('event-title').value;
  const date = document.getElementById('event-date').value;
  const endDate = document.getElementById('event-end-date').value;
  const time = document.getElementById('event-time').value;
  const description = document.getElementById('event-desc').value;
  const location = document.getElementById('event-location').value;
  const actionLink = document.getElementById('action-link').value;
  const actionLabel = document.getElementById('action-label').value;

  try {
    const url = id ? `/api/events?id=${id}` : '/api/events';
    const method = id ? 'PUT' : 'POST';
    const response = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, event_date: date, event_end_date: endDate || null, event_time: time, description, location, action_link: actionLink, action_label: actionLabel })
    });
    const result = await response.json();
    if (response.ok) {
      e.target.reset();
      document.getElementById('event-id').value = '';
      document.getElementById('event-submit-btn').textContent = 'ADD EVENT';
      document.getElementById('event-cancel-btn').style.display = 'none';
      loadEvents();
    } else {
      alert(result.error || 'Failed to save event');
    }
  } catch (error) {
    alert('Failed to save event');
  }
});

    // Restore session if token present
    if (getToken()) {
      setLoggedIn(getToken());
    }
  </script>
</body>
</html>
